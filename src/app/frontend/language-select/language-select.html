<div class="lang-select-container">
    <app-std-gap />
    <app-section caption='General info'></app-section>
    <app-std-gap />
    <div class="centered">
        <div>
            <label
                >This is tool for learning words of foreign languages. It will help you memorize
                translations from your mother language to foreign language (harder path)</label
            >
        </div>
        <div class="centered top-gap" >
            <label for="lang-scenario">Pick learning scenario</label>
            <select
                id="lang-scenario"
                [value]="selectedLanguageKey()"
                (change)="onSelectionChange($event)"
            >
                >
                <option *ngFor="let option of options" [value]="option.value">
                    {{ option.label }}
                </option>
            </select>
        </div>
    </div>

    <div class="centered top-gap">
        <mat-slide-toggle
            class="switch"
            [checked]="this.vocabularyVisible()"
            (change)="onVocabularyVisibleChange($event)"
            >Show vocabulary</mat-slide-toggle
        >
        <mat-slide-toggle
            class="switch"
            [checked]="this.progressVisible()"
            (change)="onProgressVisibleChange($event)"
            >Show progress</mat-slide-toggle
        >
    </div>
    @if (this.vocabularyVisible()) {
        <app-view-vocabulary [vocabularyService]="this.vocabulary" />
    }
    <app-std-gap />
    <app-section caption='Practise section'></app-section>
    <div class="top-gap">
    <app-question-answer
        [selectedLanguage]="this.selectedLanguageKey()"
        [learningService]="this.learning()"
    />
    </div>
    <app-std-gap />
    <app-section caption='Progress'></app-section>
    <app-std-gap />
    @if (this.progressVisible()) {
        <app-display-result [progressService]="this.progress" />
    }
</div>
