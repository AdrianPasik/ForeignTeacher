<div>
    <div>
        <form>
            <div class="centered">
                <mat-label> {{ knownLanguageCaption() }} </mat-label>
                <mat-label class="nextToken"> {{ knownLanguageText() }}</mat-label>
            </div>
            <div class="centered">

                <mat-form-field>
                    <mat-label>{{ learningMessage() }} </mat-label>
                    <input
                        matInput
                        [value]="userTranslation()"
                        (input)="userTranslationChange($event)"
                        type="text"
                    />

                </mat-form-field>
                <button class="checkButton" matButton="outlined" (click)="checkAnswerClick()">
                    {{ checkAnswerButtonCaption() }}
                </button>

            </div>
            @if (this.answerResultVisible()) {
                <app-question-answer-result
                    [success]="this.nextQuestionSuccess()"
                    [found]="this.nextQuestionFound()"
                    [translatedWord]="this.userTranslation()"
                />
            }


            <div class="centered">
                <button class="action-button" matButton="outlined" (click)="nextClick()">
                    {{ nextQuestionButtonCaption() }}
                </button>

                <button class="action-button" matButton="outlined">
                    {{ repeatQuestionThisChapterButtonCaption() }}
                </button>

                <button class="action-button" matButton="outlined">
                    {{ repeatQuestionThisChapterButtonCaption() }}
                </button>
            </div>
        </form>
    </div>
</div>
