<div>
    <div>
        <form>
            <div class="centered">
                <mat-label> {{ knownLanguageCaption() }} </mat-label>
                <mat-label class="nextToken"> {{ knownLanguageText() }}</mat-label>
            </div>
            <div class="centered">
            <mat-form-field>
                <mat-label>{{ learningMessage() }} </mat-label>
                <input matInput [value]="userTranslation()" (input)="userTranslation.set($event.target.value)"
                    type="text" />
            </mat-form-field>
            </div>
            <app-question-answer-result [success]="this.nextQuestionSuccess()" [translatedWord]="this.userTranslation()" />
            <div class="centered">
                <button matButton="outlined" (click)="checkAnswerClick()">
                    {{ checkAnswerButtonCaption() }}
                </button>
            </div>
            <div class="centered">
                <button class="action-button" matButton="outlined" (click)="nextQuestionClick()">
                    {{ nextQuestionButtonCaption() }}
                </button>

                <button class="action-button" matButton="outlined" (click)="nextQuestionClick()">
                    {{ repeatQuestionThisChapterButtonCaption() }}
                </button>

                <button class="action-button" matButton="outlined" (click)="nextQuestionClick()">
                    {{ repeatQuestionThisChapterButtonCaption() }}
                </button>
            </div>
        </form>
    </div>

</div>
